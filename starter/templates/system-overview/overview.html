  GAE starter — the system overview page (ADOPTION.md step 8, "The system overview").

  The page has fixed sections and draws every word and number from one JSON document, the
  row of gov.system_overview (overview.sql states the format). Fill data, never layout: an
  installation changes the document through the write functions in overview.sql, not this
  file. Change this file only to translate the labels in LABELS below, or to set the tokens
  under :root to the host's palette.

  Two ways to get the document:
  - Repository copy: `bash render.sh` puts it in the data element below.
  - Live page: leave the data element as it is and define, before this script runs,
      window.gaeOverviewSource = async () => <the document as an object>
    an adapter that runs `select overview from gov.system_overview` through the read
    connection. When it fails, it throws an Error whose `code` is one of no_connector,
    sign_in, not_approved or unavailable; the page shows the cause and keeps the last values
    read, with the time the database gave them.
  Nothing is loaded from elsewhere: no font, no library, no platform runtime. The fonts are
  embedded, latin subset only; a script outside it falls back to the system font.

  The look follows one rule: everything the system does is drawn in neutral ink, and the
  accent is kept for the owner, who decides. The owner's plate on top of the stack and the
  focus ring are the only accent on the page.

:root{
  --bg:#fafaf8; --surface:#f0efeb; --raise:#ffffff;
  --ink:#1b1a18; --muted:#66635d; --faint:#9b978e;
  --line:#dfdcd4; --line-strong:#c2beb3;
  --accent:#bf5430; --on-accent:#ffffff;
  --plate-a:rgba(255,255,255,.96); --plate-b:rgba(196,193,184,.84);
  --plate-rim:#8f8b82; --plate-under:#5f5c55; --plate-hi:rgba(255,255,255,.9);
  --ground:rgba(40,32,24,.20);
  --band-bg:#1b1a18; --band-fg:#f4f2ec; --band-muted:#a8a49b;
  --display:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1c1b19; --raise:#232220;
  --ink:#efede7; --muted:#a5a199; --faint:#77736c;
  --line:#302e2b; --line-strong:#4a4742;
  --accent:#e58560; --on-accent:#1a120e;
  --plate-a:rgba(86,83,78,.92); --plate-b:rgba(44,43,40,.86);
  --plate-rim:#8c887f; --plate-under:#5d5a54; --plate-hi:rgba(255,255,255,.10);
  --ground:rgba(0,0,0,.55);
  --band-bg:#232220; --band-fg:#f4f2ec; --band-muted:#a5a199;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1c1b19; --raise:#232220;
  --ink:#efede7; --muted:#a5a199; --faint:#77736c;
  --line:#302e2b; --line-strong:#4a4742;
  --accent:#e58560; --on-accent:#1a120e;
  --plate-a:rgba(86,83,78,.92); --plate-b:rgba(44,43,40,.86);
  --plate-rim:#8c887f; --plate-under:#5d5a54; --plate-hi:rgba(255,255,255,.10);
  --ground:rgba(0,0,0,.55);
  --band-bg:#232220; --band-fg:#f4f2ec; --band-muted:#a5a199;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body)}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font:600 17px/1 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:8px;font:500 11px/1.3 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;min-width:0}
.live .dot{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-strong)}
.live.ok .dot{background:var(--ink);border-color:var(--ink)}
.live.warn .dot{border-style:dashed;border-color:var(--ink)}
.live.warn{color:var(--ink)}
.live #live-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live button{appearance:none;background:none;border:1.5px solid var(--line-strong);border-radius:999px;padding:5px 11px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:border-color .2s}
.live button:hover{border-color:var(--ink)}
.live button:active{transform:scale(.97)}

/* hero */
.hero{padding:clamp(56px,9vw,112px) 0 clamp(40px,6vw,72px)}
.kicker{display:flex;align-items:center;gap:10px;margin:0 0 22px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--ink)}
h1{font:500 clamp(40px,7.2vw,88px)/.98 var(--display);letter-spacing:-.045em;margin:0;max-width:14em;text-wrap:balance}
.sub{font-size:clamp(18px,2.1vw,22px);line-height:1.45;color:var(--muted);margin:22px 0 0;max-width:36em;text-wrap:pretty}
.facts{list-style:none;margin:clamp(36px,5vw,56px) 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line)}
.facts li{padding:18px 16px 0 0;display:grid;gap:8px;align-content:start}
.facts .n{font:500 28px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts .l{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* bands */
.band{padding:clamp(64px,9vw,120px) 0;border-top:1px solid var(--line)}
.band.quiet{background:var(--surface)}
.head{display:grid;gap:14px;margin:0 0 clamp(32px,5vw,56px)}
h2{font:500 clamp(30px,4.4vw,52px)/1.04 var(--display);letter-spacing:-.035em;margin:0;max-width:16em;text-wrap:balance}
.lead{font-size:clamp(17px,1.6vw,19px);line-height:1.55;color:var(--muted);margin:0;max-width:36em}
.split{display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(32px,6vw,84px);align-items:start}

/* status */
.summary{font:500 clamp(28px,3.6vw,38px)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 22px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin:0 0 10px}
.bar span{height:8px;border-radius:4px;border:1.5px solid var(--line-strong);position:relative;overflow:hidden}
.bar span.done{background:var(--ink);border-color:var(--ink)}
.bar span.in_progress{border-color:var(--ink)}
.bar span.in_progress::after{content:"";position:absolute;inset:0;width:40%;background:var(--ink);border-radius:4px;animation:run 2.2s var(--ease) infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.barcodes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--faint);margin:0 0 28px}
.note{font-size:13.5px;line-height:1.4;color:var(--muted);margin:16px 0 0}

/* the stack */
.stack{position:relative;height:420px;display:grid;place-items:center;perspective:1600px}
.stack .ground{position:absolute;width:62%;height:16%;bottom:8%;left:19%;border-radius:50%;background:var(--ground);filter:blur(22px)}
.plates{position:relative;width:min(300px,64vw);height:min(300px,64vw);transform:rotateX(58deg) rotateZ(-45deg);transform-style:preserve-3d}
.plate{position:absolute;inset:0;border-radius:22px;border:1px solid var(--plate-rim);background:linear-gradient(135deg,var(--plate-a),var(--plate-b));box-shadow:inset 0 1px 0 var(--plate-hi),3px 3px 0 var(--plate-under),6px 6px 0 var(--plate-under);transform:translateZ(calc(var(--i) * 46px));transition:transform .35s var(--ease)}
.plate.owner{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--plate-a)),color-mix(in srgb,var(--accent) 34%,var(--plate-b)));box-shadow:inset 0 1px 0 var(--plate-hi),3px 3px 0 var(--accent),6px 6px 0 color-mix(in srgb,var(--accent) 70%,var(--plate-under))}
.plate.ground-layer{border-style:dashed;background:transparent;box-shadow:none}
.levels{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.levels li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.levels .i{font:500 12px/1.6 var(--mono);letter-spacing:.08em;color:var(--faint)}
.levels .t{font:600 18px/1.25 var(--display);letter-spacing:-.015em}
.levels .d{font-size:15px;line-height:1.6;color:var(--muted);margin-top:4px}
.levels li.owner .i{color:var(--ink)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 clamp(32px,5vw,48px)}
.tabs button{appearance:none;border:1.5px solid var(--line-strong);background:transparent;border-radius:999px;padding:9px 16px;font:500 14px/1 var(--body);cursor:pointer;transition:border-color .2s,background .2s}
.tabs button:hover{border-color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.view{display:grid;gap:clamp(48px,6vw,72px)}
.view[hidden]{display:none}
h3{font:500 clamp(21px,2.4vw,28px)/1.15 var(--display);letter-spacing:-.02em;margin:0 0 6px}
.h3sub{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 22px;max-width:40em}
.src{font:500 11.5px/1.4 var(--mono);color:var(--faint);margin:14px 0 0}

/* rows and cards */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:22px minmax(0,240px) minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .t{font:600 16.5px/1.3 var(--display);letter-spacing:-.01em}
.row .d{font-size:15px;line-height:1.6;color:var(--muted);min-width:0}
.meta{display:block;font:500 11.5px/1.5 var(--mono);color:var(--faint);margin-top:6px}
.empty{padding:16px 0;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:20px;transition:border-color .2s}
.card:hover{border-color:var(--line-strong)}
.card[open]{border-color:var(--ink)}
.card summary{list-style:none;cursor:pointer;padding:22px;display:grid;grid-template-columns:22px minmax(0,1fr) 14px;gap:12px;align-items:baseline}
.card summary::-webkit-details-marker{display:none}
.card summary .t{font:600 16.5px/1.3 var(--display);letter-spacing:-.01em}
.card summary .plus{width:12px;height:12px;position:relative;align-self:center}
.card summary .plus::before,.card summary .plus::after{content:"";position:absolute;left:0;top:5px;width:12px;height:1.5px;background:var(--ink);transition:transform .35s var(--ease)}
.card summary .plus::after{transform:rotate(90deg)}
.card[open] summary .plus::after{transform:rotate(0)}
.card .body{padding:0 22px 22px 56px;font-size:14.5px;line-height:1.5;color:var(--muted)}
.mark{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.mark.done,.mark.built{background:var(--ink);border-color:var(--ink)}
.mark.in_progress{border-color:var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.mark.planned,.mark.todo{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.chip{display:inline-block;font:500 12.5px/1.2 var(--mono);padding:4px 9px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);margin-right:6px}

/* closing band */
.closing{background:var(--band-bg);color:var(--band-fg);padding:clamp(72px,10vw,136px) 0}
.closing p{font:500 clamp(30px,5.2vw,64px)/1.06 var(--display);letter-spacing:-.035em;margin:0;max-width:16em;text-wrap:balance}
.closing p span{color:var(--band-muted)}
.closing .foot{font:500 11.5px/1.5 var(--mono);color:var(--band-muted);margin-top:40px;letter-spacing:.02em}

@media (max-width:980px){
  .facts{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .split{grid-template-columns:1fr}
  .stack{height:340px}
}
@media (max-width:560px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:1fr}
  .row{grid-template-columns:22px minmax(0,1fr)}
  .row .d{grid-column:2}
  .barcodes{display:none}
  .live #live-text{max-width:46vw}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="wordmark" id="wordmark"></span>
    <div class="live" id="live" role="status"><span class="dot" aria-hidden="true"></span><span id="live-text"></span><button type="button" id="live-btn" hidden></button></div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="kicker" id="eyebrow"></p>
      <h1 id="name"></h1>
      <p class="sub" id="lede"></p>
      <ul class="facts" id="facts"></ul>
    </div>
  </section>

  <section class="band quiet">
    <div class="wrap split">
      <div>
        <div class="head"><p class="kicker" id="k-status"></p><h2 id="h-status"></h2></div>
        <p class="summary" id="progress"></p>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <div class="barcodes" id="barcodes" aria-hidden="true"></div>
        <p class="lead" id="l-status"></p>
      </div>
      <div>
        <div class="stack" aria-hidden="true"><div class="ground"></div><div class="plates" id="plates"></div></div>
        <ol class="levels" id="levels"></ol>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div id="views"></div>
    </div>
  </section>
</main>

<footer class="closing">
  <div class="wrap">
    <p id="closing"></p>
    <div class="foot" id="foot"></div>
  </div>
</footer>

<script id="overview-data" type="application/json">null</script>
<script>
(function () {
  "use strict";

  // Translate here, and only here. The keys are fixed.
  var LABELS = {
    eyebrow: "System overview",
    progress: "{done} of {total} checkpoints done",
    noCheckpoints: "No checkpoint is written yet",
    status: { done: "done", in_progress: "in progress", todo: "to do" },
    state: { built: "built", in_progress: "in progress", planned: "planned" },
    facts: { checkpoints: "Checkpoints done", deliverables: "Deliverables", agents: "Agents",
             stores: "Stores", standards: "Standards", engagements: "Engagements" },
    statusHead: ["The installation", "The road to all systems go",
      "Each checkpoint comes from the architecture contract. Its status is computed from the owner's attestations, never written by hand."],
    levels: [
      ["We decide", "The owner attests each checkpoint and decides what no agent may decide for itself."],
      ["Constitution", "What the system is for, and the constraints every contract serves."],
      ["Contracts and values", "The rules, and the governed values they cite by key."],
      ["Implementation", "What is built or produced from the contracts, and nothing else."]
    ],
    tabs: { overview: "Overview", flows: "Flows", controls: "Controls", learning: "Learning",
            agents: "Agents and stack", standards: "GAE standards" },
    heads: {
      checkpoints: ["Checkpoints", "From the architecture contract; the status is computed from the owner's attestations."],
      deliverables: ["Deliverables", "What the system produces for the owner."],
      flows: ["Flows", "How work moves through the system."],
      controls: ["Controls", "What each control catches, and what it does not."],
      learning: ["Learning", "How what went wrong becomes a rule."],
      agents: ["Agents", "Each agent, its role and where it runs."],
      stores: ["Stores", "Where the records live."],
      corpus: ["Corpus", "The contract tree."],
      engagements: ["Engagements", "Counted and referenced, never named."],
      standards: ["GAE standards", "Version from the mirror; how each acts in this installation."]
    },
    closing: ["Evidence proposes,", "governance decides."],
    empty: "Not written yet.",
    attested: "attested {date} · decision {id}",
    contract: "architecture contract {v}",
    written: "decision {id} · {date}",
    engagements: "{count} engagement stores",
    mirror: "mirror at {commit} · {date}",
    noMirror: "No mirror run yet.",
    readAt: "Read {date}",
    reading: "Reading from the database",
    refresh: "Refresh",
    noData: "No document: render the page with render.sh, or define window.gaeOverviewSource.",
    errors: {
      no_connector: "The read connection is not connected.",
      sign_in: "The read connection needs a new sign-in.",
      not_approved: "The read connection was not approved.",
      unavailable: "The database is not available.",
      other: "The read failed."
    },
    kept: "Showing the values read at {date}."
  };

  function fill(t, v) { return t.replace(/\{(\w+)\}/g, function (_, k) { return v[k] == null ? "" : String(v[k]); }); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function day(iso) { return iso ? String(iso).slice(0, 10) : ""; }
  function stamp(iso) { return String(iso || "").replace("T", " ").slice(0, 16); }
  function byId(id) { return document.getElementById(id); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function section(doc, key) { var s = doc.sections && doc.sections[key]; return s ? s : null; }
  function itemsOf(doc, key) { var s = section(doc, key); return (s && s.items) || []; }

  function head(parent, key) {
    var h = LABELS.heads[key];
    parent.appendChild(el("h3", null, h[0]));
    parent.appendChild(el("p", "h3sub", h[1]));
  }
  function markFor(state) {
    var m = el("span", "mark " + (state || ""));
    m.setAttribute("aria-hidden", "true");
    return m;
  }
  function stateWord(state) { return LABELS.state[state] || LABELS.status[state] || ""; }
  function rowsFrom(parent, items, markOf, extraOf) {
    var box = el("div", "rows");
    if (!items || !items.length) box.appendChild(el("div", "empty", LABELS.empty));
    (items || []).forEach(function (it) {
      var r = el("div", "row");
      var st = markOf(it);
      var m = markFor(st);
      r.appendChild(m);
      var t = el("span", "t", it.title);
      if (st) t.title = stateWord(st);
      r.appendChild(t);
      var d = el("span", "d", it.text);
      var x = extraOf && extraOf(it);
      if (x) d.appendChild(el("span", "meta", x));
      else if (st) d.appendChild(el("span", "meta", stateWord(st)));
      r.appendChild(d);
      box.appendChild(r);
    });
    parent.appendChild(box);
  }
  // Objects, not statements: cards that open to their text.
  function cardsFrom(parent, items) {
    if (!items || !items.length) { var b = el("div", "rows"); b.appendChild(el("div", "empty", LABELS.empty)); parent.appendChild(b); return; }
    var grid = el("div", "cards");
    items.forEach(function (it) {
      var c = el("details", "card");
      var s = el("summary");
      s.appendChild(markFor(it.state));
      s.appendChild(el("span", "t", it.title));
      var p = el("span", "plus"); p.setAttribute("aria-hidden", "true"); s.appendChild(p);
      c.appendChild(s);
      var body = el("div", "body", it.text);
      if (it.state) body.appendChild(el("span", "meta", stateWord(it.state)));
      c.appendChild(body);
      grid.appendChild(c);
    });
    parent.appendChild(grid);
  }
  function written(parent, s) {
    if (s) parent.appendChild(el("p", "src", fill(LABELS.written, { id: s.decision_id, date: day(s.written_at) })));
  }
  function figure(parent, doc, key, asCards) {
    var f = el("section");
    head(f, key);
    var s = section(doc, key);
    if (asCards) cardsFrom(f, s && s.items);
    else rowsFrom(f, s && s.items, function (it) { return it.state; });
    written(f, s);
    parent.appendChild(f);
  }

  var TABS = ["overview", "flows", "controls", "learning", "agents", "standards"];
  var current = "overview";

  function renderTabs() {
    var nav = byId("tabs");
    clear(nav);
    TABS.forEach(function (t) {
      var b = el("button", null, LABELS.tabs[t]);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-controls", "view-" + t);
      b.addEventListener("click", function () { current = t; show(); });
      nav.appendChild(b);
    });
  }
  function show() {
    TABS.forEach(function (t) { var v = byId("view-" + t); if (v) v.hidden = t !== current; });
    Array.prototype.forEach.call(byId("tabs").querySelectorAll("button"), function (b, i) {
      b.setAttribute("aria-selected", TABS[i] === current ? "true" : "false");
    });
  }

  function renderStatic() {
    byId("eyebrow").textContent = LABELS.eyebrow;
    byId("k-status").textContent = LABELS.statusHead[0];
    byId("h-status").textContent = LABELS.statusHead[1];
    byId("l-status").textContent = LABELS.statusHead[2];
    var plates = byId("plates"), levels = byId("levels");
    clear(plates); clear(levels);
    var n = LABELS.levels.length;
    LABELS.levels.forEach(function (lv, i) {
      var p = el("div", "plate" + (i === 0 ? " owner" : ""));
      p.style.setProperty("--i", String(n - 1 - i));
      plates.appendChild(p);
      var li = el("li", i === 0 ? "owner" : null);
      li.appendChild(el("span", "i", String(i).padStart(2, "0")));
      var w = el("div");
      w.appendChild(el("div", "t", lv[0]));
      w.appendChild(el("div", "d", lv[1]));
      li.appendChild(w);
      levels.appendChild(li);
    });
    var c = byId("closing");
    clear(c);
    c.appendChild(document.createTextNode(LABELS.closing[0] + " "));
    c.appendChild(el("span", null, LABELS.closing[1]));
  }

  function render(doc) {
    var purpose = itemsOf(doc, "purpose")[0] || {};
    byId("wordmark").textContent = purpose.title || LABELS.eyebrow;
    byId("name").textContent = purpose.title || "";
    byId("lede").textContent = purpose.text || "";
    document.title = (purpose.title ? purpose.title + " — " : "") + LABELS.eyebrow;

    var cps = doc.checkpoints || [];
    var eng = doc.engagements || { count: 0, refs: [] };
    var facts = byId("facts");
    clear(facts);
    [
      [cps.length ? doc.checkpoints_done + "/" + doc.checkpoints_total : "0", LABELS.facts.checkpoints],
      [itemsOf(doc, "deliverables").length, LABELS.facts.deliverables],
      [itemsOf(doc, "agents").length, LABELS.facts.agents],
      [itemsOf(doc, "stores").length, LABELS.facts.stores],
      [(doc.standards || []).length, LABELS.facts.standards],
      [eng.count || 0, LABELS.facts.engagements]
    ].forEach(function (f) {
      var li = el("li");
      li.appendChild(el("span", "n", f[0]));
      li.appendChild(el("span", "l", f[1]));
      facts.appendChild(li);
    });

    byId("progress").textContent = cps.length
      ? fill(LABELS.progress, { done: doc.checkpoints_done, total: doc.checkpoints_total })
      : LABELS.noCheckpoints;
    var bar = byId("bar"), codes = byId("barcodes");
    clear(bar); clear(codes);
    cps.forEach(function (c) {
      var s = el("span", c.status); s.title = c.code + " · " + (LABELS.status[c.status] || c.status);
      bar.appendChild(s);
      codes.appendChild(el("span", null, c.code));
    });

    var views = byId("views");
    clear(views);
    var v;

    v = el("div", "view"); v.id = "view-overview"; v.setAttribute("role", "tabpanel");
    var cpBox = el("section"); head(cpBox, "checkpoints");
    rowsFrom(cpBox, cps.map(function (c) {
      return { title: c.code + " " + c.name, text: c.definition, status: c.status, c: c };
    }), function (it) { return it.status; }, function (it) {
      var c = it.c, parts = [LABELS.status[c.status] || c.status, fill(LABELS.contract, { v: c.contract_version })];
      if (c.attested_at) parts.push(fill(LABELS.attested, { date: day(c.attested_at), id: c.attestation_decision_id }));
      return parts.join(" · ");
    });
    var lg = el("div", "legend");
    ["done", "in_progress", "todo"].forEach(function (s) {
      var sp = el("span"); sp.appendChild(markFor(s)); sp.appendChild(document.createTextNode(LABELS.status[s])); lg.appendChild(sp);
    });
    cpBox.appendChild(lg);
    v.appendChild(cpBox);
    figure(v, doc, "deliverables", true);
    views.appendChild(v);

    ["flows", "controls", "learning"].forEach(function (t) {
      v = el("div", "view"); v.id = "view-" + t; v.setAttribute("role", "tabpanel");
      figure(v, doc, t, false); views.appendChild(v);
    });

    v = el("div", "view"); v.id = "view-agents"; v.setAttribute("role", "tabpanel");
    figure(v, doc, "agents", true); figure(v, doc, "stores", false); figure(v, doc, "corpus", false);
    var engBox = el("section"); head(engBox, "engagements");
    var er = el("div", "rows"), row = el("div", "row");
    row.appendChild(markFor(eng.count ? "built" : "planned"));
    row.appendChild(el("span", "t", fill(LABELS.engagements, { count: eng.count || 0 })));
    var refs = el("span", "d");
    (eng.refs || []).forEach(function (r) { refs.appendChild(el("span", "chip", r)); });
    row.appendChild(refs);
    er.appendChild(row); engBox.appendChild(er);
    v.appendChild(engBox);
    views.appendChild(v);

    v = el("div", "view"); v.id = "view-standards"; v.setAttribute("role", "tabpanel");
    var st = el("section"); head(st, "standards");
    var how = {};
    itemsOf(doc, "standards").forEach(function (it) { how[it.title] = it.text; });
    rowsFrom(st, (doc.standards || []).map(function (s) {
      return { title: s.title, text: how[s.title] || LABELS.empty, version: s.version, path: s.path };
    }), function () { return "built"; }, function (it) { return (it.version ? it.version + " · " : "") + it.path; });
    st.appendChild(el("p", "src", doc.mirror
      ? fill(LABELS.mirror, { commit: String(doc.mirror.commit).slice(0, 7), date: day(doc.mirror.mirrored_at) })
      : LABELS.noMirror));
    v.appendChild(st);
    views.appendChild(v);

    byId("foot").textContent = [LABELS.eyebrow, fill(LABELS.readAt, { date: stamp(doc.read_at) }),
      doc.mirror ? fill(LABELS.mirror, { commit: String(doc.mirror.commit).slice(0, 7), date: day(doc.mirror.mirrored_at) }) : LABELS.noMirror
    ].join(" · ");

    renderTabs();
    show();
  }

  var last = null;
  function live(state, text) {
    var l = byId("live");
    l.className = "live" + (state ? " " + state : "");
    byId("live-text").textContent = text;
  }
  function load() {
    if (typeof window.gaeOverviewSource !== "function") return;
    live("", LABELS.reading);
    Promise.resolve().then(window.gaeOverviewSource).then(function (doc) {
      if (!doc || doc.format !== 1) throw Object.assign(new Error("format"), { code: "other" });
      last = doc; render(doc);
      live("ok", fill(LABELS.readAt, { date: stamp(doc.read_at) }));
    }).catch(function (err) {
      var msg = LABELS.errors[err && err.code] || LABELS.errors.other;
      if (last) msg += " " + fill(LABELS.kept, { date: stamp(last.read_at) });
      live("warn", msg);
    });
  }

  renderStatic();
  byId("wordmark").textContent = LABELS.eyebrow;
  var btn = byId("live-btn");
  btn.textContent = LABELS.refresh;
  btn.addEventListener("click", load);

  var inline = null;
  try { inline = JSON.parse(byId("overview-data").textContent); } catch (_) { inline = null; }
  if (inline && inline.format === 1) {
    last = inline; render(inline);
    live("ok", fill(LABELS.readAt, { date: stamp(inline.read_at) }));
  } else if (typeof window.gaeOverviewSource === "function") {
    btn.hidden = false;
    load();
  } else {
    live("warn", LABELS.noData);
  }
})();
</script>
</body>
</html>
