  GAE starter — the system overview page (ADOPTION.md step 8, "The system overview").

  The page has fixed sections and draws every word and number from one JSON document, the
  row of gov.system_overview (overview.sql states the format). Fill data, never layout: an
  installation changes the document through the write functions in overview.sql, not this
  file. Change this file only to translate the labels in LABELS below, or to set the tokens
  under :root to the host's palette.

  Two ways to get the document:
  - Repository copy: `bash render.sh` puts it in the data element below.
  - Live page: leave the data element as it is and define, before this script runs,
      window.gaeOverviewSource = async () => <the document as an object>
    an adapter that runs `select overview from gov.system_overview` through the read
    connection. When it fails, it throws an Error whose `code` is one of no_connector,
    sign_in, not_approved or unavailable; the page shows the cause and keeps the last values
    read, with the time the database gave them.
  Nothing is loaded from elsewhere: no font, no library, no platform runtime.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System overview</title>
<style>
:root{
  --bg:#ffffff; --ink:#1f1e1d; --muted:#6f6d66; --faint:#9a978e;
  --line:#e4e1d8; --line-strong:#c9c5ba; --bar:#8f8d87;
  --accent:#c4623f; --ok:#2e8b4e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --ink:#ecebe5; --muted:#a8a59c; --faint:#7f7c74;
  --line:#3a3936; --line-strong:#55534e; --bar:#8a8780;
  --accent:#dc7a55; --ok:#5cb874; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --ink:#ecebe5; --muted:#a8a59c; --faint:#7f7c74;
  --line:#3a3936; --line-strong:#55534e; --bar:#8a8780;
  --accent:#dc7a55; --ok:#5cb874; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.wrap{max-width:820px;margin:0 auto;padding:36px 16px 72px}
.mono,.eyebrow,.k,.src,.live,.tabs button,.group{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:24px;line-height:1.2;font-weight:600;margin:0 0 8px}
.lede{font-size:15px;color:var(--muted);max-width:64ch;margin:0}
.status{margin-top:32px;display:grid;gap:14px}
.status p{margin:0}
.cps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px}
.cps li{display:grid;gap:7px;align-content:start;font-size:13px;line-height:1.35}
.cps li::before{content:"";height:5px;background:var(--line)}
.cps li.done::before{background:var(--bar)}
.cps li.in_progress::before{background:var(--accent)}
.cps li.todo{color:var(--muted)}
.k{display:block;font-size:11px;color:var(--faint)}
.src{font-size:11px;color:var(--faint)}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:11px;color:var(--faint)}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.live.ok .dot{background:var(--ok)}
.live.warn{color:var(--accent)}
.live.warn .dot{background:var(--accent)}
.live button{appearance:none;background:none;border:1px solid var(--line-strong);border-radius:4px;padding:2px 8px;font:inherit;color:var(--ink);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:4px 24px;margin:40px 0 0;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0;font-size:12px;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible,.live button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tabs .sep{align-self:center;color:var(--line-strong);font-family:var(--mono)}
.view{padding-top:40px;display:grid;gap:56px}
.view[hidden]{display:none}
h2{font-size:18px;font-weight:600;margin:0 0 3px}
.sub{font-size:14px;color:var(--muted);margin:0 0 24px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,220px) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .t{font-weight:500}
.row .d{color:var(--muted);min-width:0}
.row .d .k{margin-top:3px}
.empty{padding:12px 0;color:var(--faint);font-size:13px;border-bottom:1px solid var(--line)}
.mark{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.2px solid var(--line-strong)}
.mark.done,.mark.built{background:var(--bar);border-color:var(--bar)}
.mark.in_progress{border-color:var(--accent);background:linear-gradient(90deg,var(--bg) 50%,var(--accent) 50%)}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
@media (max-width:640px){
  h1{font-size:22px}
  .cps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:28px minmax(0,1fr)}
  .row .d{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="name"></h1>
    <p class="lede" id="lede"></p>
    <div class="status">
      <p id="progress"></p>
      <ol class="cps" id="cps"></ol>
      <div class="live" id="live" role="status"><span class="dot" aria-hidden="true"></span><span id="live-text"></span><button type="button" id="live-btn" hidden></button></div>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="views"></main>
</div>

<script id="overview-data" type="application/json">null</script>
<script>
(function () {
  "use strict";

  // Translate here, and only here. The keys are fixed.
  var LABELS = {
    eyebrow: "System overview",
    progress: "Installation: {done} of {total} checkpoints done.",
    noCheckpoints: "No checkpoint is written yet.",
    status: { done: "done", in_progress: "in progress", todo: "to do" },
    state: { built: "built", in_progress: "in progress", planned: "planned" },
    tabs: { overview: "Overview", flows: "Flows", controls: "Controls", learning: "Learning",
            agents: "Agents and stack", standards: "GAE standards" },
    heads: {
      checkpoints: ["The road to all systems go", "Checkpoints from the architecture contract; the status is computed from the owner's attestations."],
      deliverables: ["Deliverables", "What the system produces for the owner."],
      flows: ["Flows", "How work moves through the system."],
      controls: ["Controls", "What each control catches, and what it does not."],
      learning: ["Learning", "How what went wrong becomes a rule."],
      agents: ["Agents", "Each agent, its role and where it runs."],
      stores: ["Stores", "Where the records live."],
      corpus: ["Corpus", "The contract tree."],
      engagements: ["Engagements", "Counted and referenced, never named."],
      standards: ["GAE standards", "Version from the mirror; how each acts in this installation."]
    },
    empty: "Not written yet.",
    attested: "attested {date}, decision {id}",
    contract: "architecture contract {v}",
    written: "decision {id}, {date}",
    engagements: "{count} engagement stores",
    mirror: "mirror at {commit}, {date}",
    noMirror: "No mirror run yet.",
    readAt: "Read from the database at {date}.",
    reading: "Reading from the database.",
    refresh: "Refresh",
    noData: "No document: render the page with render.sh, or define window.gaeOverviewSource.",
    errors: {
      no_connector: "The read connection is not connected.",
      sign_in: "The read connection needs a new sign-in.",
      not_approved: "The read connection was not approved.",
      unavailable: "The database is not available.",
      other: "The read failed."
    },
    kept: "Showing the values read at {date}."
  };

  function fill(t, v) { return t.replace(/\{(\w+)\}/g, function (_, k) { return v[k] == null ? "" : String(v[k]); }); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function day(iso) { return iso ? String(iso).slice(0, 10) : ""; }
  function byId(id) { return document.getElementById(id); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }

  function head(parent, key) {
    var h = LABELS.heads[key];
    parent.appendChild(el("h2", null, h[0]));
    parent.appendChild(el("p", "sub", h[1]));
  }
  function rowsFrom(parent, items, markOf, extraOf) {
    var box = el("div", "rows");
    if (!items || !items.length) box.appendChild(el("div", "empty", LABELS.empty));
    (items || []).forEach(function (it) {
      var r = el("div", "row");
      var m = el("span", "mark " + (markOf(it) || ""));
      if (markOf(it)) m.title = LABELS.state[markOf(it)] || LABELS.status[markOf(it)] || "";
      r.appendChild(m);
      r.appendChild(el("span", "t", it.title));
      var d = el("span", "d", it.text);
      var x = extraOf && extraOf(it);
      if (x) d.appendChild(el("span", "k", x));
      r.appendChild(d);
      box.appendChild(r);
    });
    parent.appendChild(box);
  }
  function section(doc, key) {
    var s = doc.sections && doc.sections[key];
    return s ? s : null;
  }
  function figure(parent, doc, key) {
    var f = el("section");
    head(f, key);
    var s = section(doc, key);
    rowsFrom(f, s && s.items, function (it) { return it.state; });
    if (s) f.appendChild(el("p", "src", fill(LABELS.written, { id: s.decision_id, date: day(s.written_at) })));
    parent.appendChild(f);
  }

  var TABS = ["overview", "flows", "controls", "learning", "agents", "standards"];
  var current = "overview";

  function renderTabs() {
    var nav = byId("tabs");
    clear(nav);
    TABS.forEach(function (t) {
      if (t === "standards") nav.appendChild(el("span", "sep", "|"));
      var b = el("button", null, LABELS.tabs[t]);
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", t === current ? "true" : "false");
      b.addEventListener("click", function () { current = t; show(); });
      nav.appendChild(b);
    });
  }
  function show() {
    TABS.forEach(function (t) { var v = byId("view-" + t); if (v) v.hidden = t !== current; });
    Array.prototype.forEach.call(byId("tabs").querySelectorAll("button"), function (b, i) {
      b.setAttribute("aria-selected", TABS[i] === current ? "true" : "false");
    });
  }

  function render(doc) {
    var purpose = (section(doc, "purpose") || { items: [] }).items[0] || {};
    byId("eyebrow").textContent = LABELS.eyebrow;
    byId("name").textContent = purpose.title || "";
    byId("lede").textContent = purpose.text || "";
    document.title = (purpose.title ? purpose.title + " — " : "") + LABELS.eyebrow;

    var cps = doc.checkpoints || [];
    byId("progress").textContent = cps.length
      ? fill(LABELS.progress, { done: doc.checkpoints_done, total: doc.checkpoints_total })
      : LABELS.noCheckpoints;
    var ol = byId("cps");
    clear(ol);
    cps.forEach(function (c) {
      var li = el("li", c.status);
      li.appendChild(el("span", "k", c.code + " · " + (LABELS.status[c.status] || c.status)));
      li.appendChild(document.createTextNode(c.name));
      ol.appendChild(li);
    });

    var views = byId("views");
    clear(views);
    var v;

    v = el("div", "view"); v.id = "view-overview";
    var cpBox = el("section"); head(cpBox, "checkpoints");
    rowsFrom(cpBox, cps.map(function (c) {
      return { title: c.code + " " + c.name, text: c.definition, status: c.status, c: c };
    }), function (it) { return it.status; }, function (it) {
      var c = it.c, parts = [LABELS.status[c.status] || c.status, fill(LABELS.contract, { v: c.contract_version })];
      if (c.attested_at) parts.push(fill(LABELS.attested, { date: day(c.attested_at), id: c.attestation_decision_id }));
      return parts.join(" · ");
    });
    var lg = el("div", "legend");
    ["done", "in_progress", "todo"].forEach(function (s) {
      var sp = el("span"); sp.appendChild(el("span", "mark " + s)); sp.appendChild(document.createTextNode(LABELS.status[s])); lg.appendChild(sp);
    });
    cpBox.appendChild(lg);
    v.appendChild(cpBox);
    figure(v, doc, "deliverables");
    views.appendChild(v);

    ["flows", "controls", "learning"].forEach(function (t) {
      v = el("div", "view"); v.id = "view-" + t; figure(v, doc, t); views.appendChild(v);
    });

    v = el("div", "view"); v.id = "view-agents";
    figure(v, doc, "agents"); figure(v, doc, "stores"); figure(v, doc, "corpus");
    var eng = el("section"); head(eng, "engagements");
    var e = doc.engagements || { count: 0, refs: [] };
    eng.appendChild(el("p", null, fill(LABELS.engagements, { count: e.count })));
    if (e.refs && e.refs.length) eng.appendChild(el("p", "src", e.refs.join(", ")));
    v.appendChild(eng);
    views.appendChild(v);

    v = el("div", "view"); v.id = "view-standards";
    var st = el("section"); head(st, "standards");
    var how = {};
    ((section(doc, "standards") || { items: [] }).items).forEach(function (it) { how[it.title] = it.text; });
    rowsFrom(st, (doc.standards || []).map(function (s) {
      return { title: s.title, text: how[s.title] || LABELS.empty, version: s.version, path: s.path };
    }), function () { return "built"; }, function (it) { return (it.version ? it.version + " · " : "") + it.path; });
    st.appendChild(el("p", "src", doc.mirror
      ? fill(LABELS.mirror, { commit: String(doc.mirror.commit).slice(0, 7), date: day(doc.mirror.mirrored_at) })
      : LABELS.noMirror));
    v.appendChild(st);
    views.appendChild(v);

    renderTabs();
    show();
  }

  var last = null;
  function live(state, text) {
    var l = byId("live");
    l.className = "live" + (state ? " " + state : "");
    byId("live-text").textContent = text;
  }
  function load() {
    if (typeof window.gaeOverviewSource !== "function") return;
    live("", LABELS.reading);
    Promise.resolve().then(window.gaeOverviewSource).then(function (doc) {
      if (!doc || doc.format !== 1) throw Object.assign(new Error("format"), { code: "other" });
      last = doc; render(doc);
      live("ok", fill(LABELS.readAt, { date: String(doc.read_at).replace("T", " ").slice(0, 16) }));
    }).catch(function (err) {
      var msg = LABELS.errors[err && err.code] || LABELS.errors.other;
      if (last) msg += " " + fill(LABELS.kept, { date: String(last.read_at).replace("T", " ").slice(0, 16) });
      live("warn", msg);
    });
  }

  var btn = byId("live-btn");
  btn.textContent = LABELS.refresh;
  btn.addEventListener("click", load);

  var inline = null;
  try { inline = JSON.parse(byId("overview-data").textContent); } catch (_) { inline = null; }
  if (inline && inline.format === 1) {
    last = inline; render(inline);
    live("ok", fill(LABELS.readAt, { date: String(inline.read_at).replace("T", " ").slice(0, 16) }));
  } else if (typeof window.gaeOverviewSource === "function") {
    btn.hidden = false;
    load();
  } else {
    live("warn", LABELS.noData);
  }
})();
</script>
</body>
</html>
